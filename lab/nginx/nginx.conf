# nginx como caché HTTP compartida delante del origen "web".
# Respeta Cache-Control del origen (public/private/max-age) y revalida con ETag (proxy_cache_revalidate).
# X-Cache-Status: MISS · HIT · EXPIRED · REVALIDATED · BYPASS
events {}
http {
  proxy_cache_path /var/cache/nginx keys_zone=estaticos:10m max_size=50m inactive=10m;
  log_format cache '$request → $status · caché $upstream_cache_status';
  access_log /dev/stdout cache;

  server {
    listen 80;

    location /static/ {
      proxy_pass http://web:3000;
      proxy_cache estaticos;
      proxy_cache_revalidate on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Bien configurado: el origen dice "private", nginx no la guarda.
    location = /mi-cuenta {
      proxy_pass http://web:3000;
      proxy_cache estaticos;
      proxy_set_header X-Usuario $http_x_usuario;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Mal configurado a propósito: ignora Cache-Control y guarda /mi-cuenta para todos.
    location = /mi-cuenta-mal {
      proxy_pass http://web:3000/mi-cuenta;
      proxy_cache estaticos;
      proxy_cache_key "mal $request_uri";
      proxy_ignore_headers Cache-Control;
      proxy_hide_header Cache-Control;
      proxy_cache_valid 200 60s;
      proxy_set_header X-Usuario $http_x_usuario;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /health { return 200 "ok\n"; }
  }
}
